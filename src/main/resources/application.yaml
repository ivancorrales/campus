spring:
  application:
    name: campushub
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/campushub}
    username: ${JDBC_USER:campushub}
    password: ${JDBC_PASSWORD:campushub}
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update # Solo para la práctica: en producción usar migraciones
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/campushub}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: ${PORT:8080}